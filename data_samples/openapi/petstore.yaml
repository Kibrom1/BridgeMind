openapi: 3.0.0
info:
  title: PetStore API
  description: Sample PetStore API for BridgeMind
  version: 1.0.0
servers:
  - url: https://api.petstore.com/v1
    description: Production server
paths:
  /pets:
    get:
      operationId: getPets
      summary: List all pets
      description: Retrieve a list of pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      summary: Create a new pet
      description: Add a new pet to the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{id}:
    get:
      operationId: getPetById
      summary: Get pet by ID
      description: Retrieve a specific pet by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
  /appointments:
    post:
      operationId: createAppointment
      summary: Create a new appointment
      description: Schedule an appointment for a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
      responses:
        '201':
          description: Appointment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Pet:
      type: object
      required:
        - name
        - species
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: Fluffy
        species:
          type: string
          enum: [dog, cat, bird, other]
          example: dog
        age:
          type: integer
          minimum: 0
          example: 3
        owner:
          type: string
          example: John Doe
    Appointment:
      type: object
      required:
        - petId
        - date
      properties:
        petId:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"
        reason:
          type: string
          example: Annual checkup
        notes:
          type: string
          example: First visit

