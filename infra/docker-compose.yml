version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: bridgemind-postgres
    environment:
      POSTGRES_USER: bridgemind
      POSTGRES_PASSWORD: bridgemind_dev
      POSTGRES_DB: bridgemind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgemind"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: bridgemind-api
    environment:
      DATABASE_URL: postgresql://bridgemind:bridgemind_dev@postgres:5432/bridgemind
      ENVIRONMENT: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-haiku-20240307}
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../bridgemind:/app/bridgemind
      - ../data_samples:/app/data_samples
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn bridgemind.api.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build:
      context: ../bridgemind/ui
      dockerfile: Dockerfile
    container_name: bridgemind-ui
    ports:
      - "3000:3000"
    volumes:
      - ../bridgemind/ui:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:

